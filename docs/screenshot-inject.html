      // 不能把 then 兜底成函数，否则 api 会被当成 thenable 让所有 await 挂起
      if (k === 'then' || k === Symbol.toStringTag) return undefined;
      if (k in t) return t[k];
      return function () { return Promise.resolve({}); };

  })};
